function addDrawPoint(point){if(state.points.length>=243){feedback('Try arranging the dots you already have.');return}saveDrawing();const n=state.points.length;state.points.push(point||{x:310+(n%18)*32,y:93+Math.floor(n/18)*29});renderDrawing();lock('Make a picture, then check it.');}
function multiplyDrawing(){if(!state.points.length){feedback('Start with a dot, then grow your picture.');return}if(state.points.length*state.factor>243){feedback('That picture would be very large. Try undoing a step.');return}saveDrawing();const pts=state.points,minX=Math.min(...pts.map(p=>p.x)),maxX=Math.max(...pts.map(p=>p.x)),minY=Math.min(...pts.map(p=>p.y)),maxY=Math.max(...pts.map(p=>p.y));const w=Math.max(32,maxX-minX+32),h=Math.max(32,maxY-minY+32),f=state.factor,horizontal=w<=h;const newW=horizontal?w*f:w,newH=horizontal?h:h*f,scale=Math.min(1,580/newW,340/newH);let next=[];for(let k=0;k<f;k++)pts.forEach(p=>next.push({x:600-newW*scale/2+(p.x-minX+16+(horizontal?k*w:0))*scale,y:240-newH*scale/2+(p.y-minY+16+(horizontal?0:k*h))*scale}));state.points=next;renderDrawing();lock('Make a picture, then check it.');}
function renderEnd(){decor.innerHTML='';let a=[];const xs=[137,367,597,827,1057];const labels=['Triangular numbers','Square numbers','Cube numbers','All 1s','Counting numbers'];const seq=['1, 3, 6, 10, …','1, 4, 9, 16, …','1, 8, 27, 64, …','1, 1, 1, 1, …','1, 2, 3, 4, …'];xs.forEach((x,i)=>{t(x,37,labels[i],'small');t(x,207,seq[i],'tiny')});a.push(...tri(4,137,70,26,8,'ht'),...grid(4,4,367,111,25,8,'hs','dot'),...cube(3,597,139,21,'hc'));for(let i=0;i<5;i++)a.push({id:'h1'+i,x:779+i*24,y:113,r:8});for(let i=0;i<4;i++)a.push(...dotGroup(i+1,1000+i*39,111,32,50,'hcount'+i,5));const xs2=[187,462,762,1050];['Odd numbers','Even numbers','Same number, two shapes','Powers of 2 and powers of 3'].forEach((n,i)=>t(xs2[i],270,n,'small'));a.push(...dotGroup(7,187,322,140,90,'ho',8,'odd'),...dotGroup(8,462,322,140,90,'he',8,'even'));a.push(...grid(6,6,721,323,11,3.5,'h36','dot'),...tri(8,810,284,11,3.5,'ht36'));t(187,398,'1, 3, 5, 7, …','tiny');t(462,398,'2, 4, 6, 8, …','tiny');t(762,398,'36 = 6 × 6 = 1 + 2 + … + 8','tiny');lines(1050,321,['2: 1, 2, 4, 8, …','3: 1, 3, 9, 27, …'],'small',37);el('path',{d:'M190 532Q600 423 1010 532',fill:'none',stroke:'#b5cbb3','stroke-width':13},decor);t(600,485,'Next: 1.4 Relations among Number Sequences','label');renderPieces(a)}
function pointFromEvent(e){const p=stage.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(stage.getScreenCTM().inverse())}
stage.addEventListener('pointerdown',e=>{const node=e.target.closest('.piece.placeable');if(node){e.preventDefault();const p=model.find(p=>p.id===node.dataset.id);selected=p.id;pieces.querySelectorAll('.piece').forEach(n=>n.classList.toggle('selected',n===node));const pt=pointFromEvent(e);drag={id:p.id,startX:pt.x,startY:pt.y,offsetX:pt.x-p.x,offsetY:pt.y-p.y,moved:false,node};node.classList.add('dragging');stage.setPointerCapture(e.pointerId);}else if(steps[index].type==='draw'){if(e.target.closest('foreignObject'))return;const pt=pointFromEvent(e);if(pt.x>=278&&pt.x<=922&&pt.y>=54&&pt.y<=425)addDrawPoint({x:pt.x,y:pt.y});}});
stage.addEventListener('pointermove',e=>{if(!drag)return;const p=pointFromEvent(e);if(Math.hypot(p.x-drag.startX,p.y-drag.startY)>6)drag.moved=true;drag.node.setAttribute('transform',`translate(${p.x-drag.offsetX} ${p.y-drag.offsetY})`)});
stage.addEventListener('pointerup',e=>{if(!drag)return;const p=pointFromEvent(e),d=drag;drag=null;d.node.classList.remove('dragging');if(d.moved){let nearest=-1,dist=Infinity;targets.forEach((t,i)=>{const v=Math.hypot(p.x-t.x,p.y-t.y);if(v<dist){nearest=i;dist=v}});if(dist<75){placeAt(nearest,d.id);return}renderPieces(model,false);feedback(steps[index].type==='triangleBuild'?'Hmm… look at how the rows are growing. Try again.':'Try placing it in an empty space.');}else renderPieces(model,false)});
stage.addEventListener('pointercancel',()=>{drag=null;renderPieces(model,false)});
stage.addEventListener('click',e=>{const node=e.target.closest('.ghost');if(node){if(selected)placeAt(Number(node.dataset.target),selected);else feedback('Select a dot or block first. Then tap a space.');}});
stage.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const node=e.target.closest('[data-id],.ghost');if(!node)return;e.preventDefault();if(node.classList.contains('ghost')){if(selected)placeAt(Number(node.dataset.target),selected);else feedback('Select a dot or block first. Then choose a space.');}else if(node.classList.contains('placeable')){selected=node.dataset.id;renderPieces(model,false);ghosts.querySelector('.ghost')?.focus();}});
$('#back').onclick=()=>navigate(index-1);$('#next').onclick=()=>{if(done)navigate(index===35?0:index+1)};$('#reset').onclick=()=>navigate(index);$('#journey').onchange=e=>navigate(Number(e.target.value));$('#voice').onclick=()=>{voiceOn=!voiceOn;$('#voice').setAttribute('aria-pressed',voiceOn);$('#voice .toolword').textContent=voiceOn?'Voice on':'Voice off';$('#voice').title=voiceOn?'Turn voice-over off':'Turn voice-over on';if(voiceOn)speak(steps[index].vo);else if('speechSynthesis'in window)speechSynthesis.cancel()};$('#replay').onclick=()=>{voiceOn=true;$('#voice').setAttribute('aria-pressed','true');$('#voice .toolword').textContent='Voice on';speak(steps[index].vo)};$('#full').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){feedback('You can use your browser’s full-screen control.','')}};
document.addEventListener('keydown',e=>{if(e.target.matches('input,select,button'))return;if(e.key==='ArrowRight'&&done){e.preventDefault();navigate(index===35?0:index+1)}if(e.key==='ArrowLeft'){e.preventDefault();navigate(index-1)}});
navigate(0);
